name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci_test_only
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RESEARCH_ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas_ci:atlas_ci_test_only@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - name: Verify configured Python
        run: test "$(python --version)" = "Python $(cat .python-version)"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
