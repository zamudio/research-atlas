# Run 001 remains UNEXECUTED. This file is research intent, not execution state.
question: >-
  What is well supported about human learning and effective instruction, and what should inform
  the design of an adaptive AI tutor?
research_questions:
  - >-
    Which mechanisms, constructs, and phenomena are important to acquisition, retention,
    transfer, and effective instruction?
  - >-
    Which instructional strategies and interventions have reliable effects, and under which
    conditions?
  - >-
    How are learner states and processes operationalized and measured, and what limits their
    interpretation?
  - >-
    How are effects moderated by prior knowledge, expertise, age or development, task
    difficulty, domain, modality, and setting?
  - >-
    Which widely discussed claims are mixed, weak, contested, null, narrow, or contradicted?
constraints:
  - "Cover human learners of all ages; record population and generalizability limits."
  - "Focus on human learning and instruction; exclude unrelated machine-learning research."
  - "Prefer useful English-language syntheses from 2010-2026; include older foundational work when justified."
  - "Separate reported findings from synthesis; preserve contradictions, nulls, and uncertainty."
  - "This is an internal landscape review, not a publication-grade systematic review."
plan:
  - "Investigate learning, memory, practice, retention, and transfer."
  - "Investigate instructional design, worked examples, and cognitive load."
  - "Investigate feedback, formative assessment, testing, and measurement."
  - "Investigate metacognition, calibration, and self-regulated learning."
  - "Investigate misconceptions, errors, and conceptual change."
  - "Investigate motivation, engagement, and educational outcomes."
  - "Investigate evidence-backed moderators without learning-style assumptions."
  - "Investigate human or intelligent tutoring and instructional dialogue."
  - "Use targeted, provider-appropriate queries and record what actually executes."
  - "Prioritize relevant reviews and syntheses; examine primary studies where needed."
expected_outputs:
  - "A traceable summary of findings and their strength, limits, and disagreements."
  - "Measurement and implementation considerations supported by the evidence."
  - "Coverage limitations, unanswered questions, and priorities for follow-up research."
