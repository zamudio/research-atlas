[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-atlas"
version = "1.0.0"
description = "Retrieve ranked source passages from open-access scholarly full text."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pypdf>=6.19,<7",
]

[project.scripts]
atlas = "research_atlas.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_atlas"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
exclude = [".pytest_cache", ".ruff_cache", ".uv-cache", ".uv-python", ".venv"]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
