project_id: "ai-tutor"
display_name: "AI Tutor Research"
research_domain: "human learning and instruction relevant to an adaptive AI tutoring product"
objectives:
  - "Build a provenance-tracked evidence base about human learning and instruction."
  - "Understand supported findings, measurement limits, moderators, and contested claims."
  - "Separate evidence synthesis from later product and architecture application."
constraints:
  - "Keep observations distinct from inferences."
  - "Do not infer unobservable traits or encode unsupported learning styles."
  - "Do not promote frequently mentioned constructs into product architecture without evidence."
  - "Preserve evidence and uncertainty when producing downstream guidance."
scope:
  population:
    - "human learners of all ages; record population and generalizability"
  domain:
    - "human learning and instruction"
