[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-atlas"
version = "0.6.0"
description = "Provider-neutral discovery for evidence-backed research."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<2.1",
]

[project.scripts]
research-atlas-dry-run = "research_atlas.cli.dry_run:main"

[dependency-groups]
dev = [
  "alembic>=1.20,<2",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_atlas"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
exclude = [".pytest_cache", ".ruff_cache", ".uv-cache", ".uv-python", ".venv"]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
