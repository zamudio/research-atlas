[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-workbench"
version = "0.2.0"
description = "Reusable, provenance-first research-to-product contracts and protocols."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_workbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
exclude = [".pytest_cache", ".ruff_cache", ".uv-cache", ".uv-python", ".venv"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
